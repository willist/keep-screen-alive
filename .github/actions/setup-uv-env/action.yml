name: Setup uv env
description: Set up Python, install uv, and sync project dependencies.

inputs:
  python-version:
    description: Python version to set up.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Sync dependencies
      shell: bash
      run: uv sync
