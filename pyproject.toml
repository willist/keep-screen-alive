[project]
name = "keep-screen-alive"
version = "0.4.0"
description = "A cross-platform tool to keep your screen awake using a relative datetime"
authors = [{name = "Tim Willis"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.1",
    "dateparser>=1.1.8",
    "six>=1.16.0",
]

[project.optional-dependencies]
dbus = ["PyGObject>=3.42; sys_platform == 'linux'"]

[project.scripts]
keep-alive = "keep_alive.run:main"
dbus-inhibit = "keep_alive.dbus_inhibit:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22,<0.17.0",
    "mypy>=1.18,<3.0",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "types-dateparser>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["keep_alive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "W", "UP",
    "B", "SIM", "C901", "PLR09", "S",
    "RUF", "PIE", "PTH", "C4", "RET", "ISC", "N",
    "FURB", "LOG", "G", "ASYNC", "PGH", "TID", "FA",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S108", "RUF043", "PLR0913", "PLR0917"]
"keep_alive/backends.py" = ["S603", "S607"]
"keep_alive/run.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["gi", "gi.repository.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
